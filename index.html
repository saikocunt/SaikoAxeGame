<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SAIKO INU — Magma Axe</title>
<style>
  html,body{margin:0;height:100%;background:#0b0809;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#e8dcd0;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#120c0d;box-shadow:0 0 40px #000, 0 0 0 2px #3a1a16;image-rendering:auto}
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:14px;pointer-events:none}
  #touch .grp{display:flex;gap:12px;pointer-events:auto}
  .btn{width:68px;height:68px;border-radius:50%;background:rgba(40,16,14,.65);border:2px solid rgba(255,120,40,.55);color:#ffb070;font:bold 22px Georgia,serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(255,90,20,.25) inset}
  .btn.big{width:84px;height:84px;font-size:15px;letter-spacing:1px}
  .btn.on{background:rgba(255,90,20,.45)}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="grp"><div class="btn" data-k="left">&#9664;</div><div class="btn" data-k="right">&#9654;</div></div>
  <div class="grp"><div class="btn" data-k="jump">&#9650;</div><div class="btn big" data-k="attack">AXE</div></div>
</div>
<script>
(() => {
const W = 960, H = 540, GROUND = 450;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- responsive scaling ----------
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px';
}
addEventListener('resize', fit); fit();

// ---------- input ----------
const keys = {left:false,right:false,jump:false,attack:false};
let attackPressed = false, jumpPressed = false, startPressed = false;
const map = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'attack',KeyJ:'attack',KeyK:'attack'};
addEventListener('keydown', e => {
  const k = map[e.code];
  if (k){ e.preventDefault(); if(!keys[k]){ if(k==='attack') attackPressed=true; if(k==='jump') jumpPressed=true; } keys[k]=true; }
  if (e.code==='Enter' || e.code==='Space') startPressed = true;
  if (e.code==='KeyP' && state==='play') paused=!paused;
});
addEventListener('keyup', e => { const k = map[e.code]; if (k) keys[k]=false; });
cv.addEventListener('pointerdown', e => { e.preventDefault(); attackPressed = true; startPressed = true; });
document.querySelectorAll('#touch .btn').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); e.stopPropagation(); if(!keys[k]){ if(k==='attack') attackPressed=true; if(k==='jump') jumpPressed=true; } keys[k]=true; startPressed=true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});

// ---------- audio (tiny synth, no files) ----------
let ac = null;
function sfx(type){
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    if(type==='swing'){ o.type='sawtooth'; o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(90,t+.15); g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.16); o.start(t); o.stop(t+.17); }
    else if(type==='hit'){ o.type='square'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(40,t+.2); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.22); o.start(t); o.stop(t+.23); }
    else if(type==='hurt'){ o.type='triangle'; o.frequency.setValueAtTime(500,t); o.frequency.exponentialRampToValueAtTime(70,t+.35); g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.36); o.start(t); o.stop(t+.37); }
    else if(type==='over'){ o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(30,t+1.2); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+1.2); o.start(t); o.stop(t+1.25); }
  }catch(e){}
}

// ---------- state ----------
let state = 'title', paused = false;
let player, enemies, particles, embers, floats, score, best, combo, comboT, spawnT, elapsed, shake, hitStop, overT;
best = +(localStorage.getItem('saikoInuBest')||0);
embers = Array.from({length:70}, () => newEmber(true));
function newEmber(any){ return {x:Math.random()*W, y: any?Math.random()*H:H+10, vy:-(15+Math.random()*40), vx:(Math.random()-.5)*15, r:Math.random()*2+.5, a:Math.random()*.6+.2, ph:Math.random()*6}; }

function reset(){
  player = {x:200, y:GROUND, vx:0, vy:0, face:1, hp:3, inv:0, atk:0, atkCD:0, hitIds:new Set(), onGround:true, step:0};
  enemies = []; particles = []; floats = [];
  score = 0; combo = 0; comboT = 0; spawnT = 1.2; elapsed = 0; shake = 0; hitStop = 0; overT = 0;
}
reset();

const ATK_DUR = 0.34;
let nextId = 1;
function spawn(){
  const diff = Math.min(1, elapsed/120);
  const r = Math.random();
  let e;
  if (elapsed > 25 && r < 0.18 + diff*0.1){
    e = {type:'brute', w:70, h:110, hp:3, speed:55+diff*40, y:GROUND};
  } else if (elapsed > 10 && r < 0.45){
    e = {type:'wisp', w:40, h:40, hp:1, speed:110+diff*90, baseY:GROUND-90-Math.random()*90, ph:Math.random()*6};
    e.y = e.baseY;
  } else {
    e = {type:'ronin', w:46, h:90, hp:1, speed:90+Math.random()*50+diff*90, y:GROUND};
  }
  e.id = nextId++; e.x = W + 60; e.flash = 0; e.kb = 0; e.t = 0;
  enemies.push(e);
}

function burst(x,y,n,colors,spd=260){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = Math.random()*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.5+Math.random()*.6,max:1,r:Math.random()*3+1.5,c:colors[(Math.random()*colors.length)|0]});
  }
}

// ---------- update ----------
function update(dt){
  // embers always drift
  for(const m of embers){ m.y += m.vy*dt; m.x += (m.vx + Math.sin(m.ph += dt*2)*10)*dt; if(m.y < -10) Object.assign(m, newEmber(false)); }

  if (state==='title' || state==='over'){
    if (state==='over') overT += dt;
    if (startPressed && (state==='title' || overT > 0.8)){ reset(); state='play'; }
    startPressed = attackPressed = jumpPressed = false;
    updateParticles(dt);
    return;
  }
  if (paused){ startPressed=attackPressed=jumpPressed=false; return; }
  if (hitStop > 0){ hitStop -= dt; attackPressed=false; return; }

  elapsed += dt;
  const p = player;
  // movement
  const acc = 2600, maxV = 300;
  let dir = (keys.right?1:0) - (keys.left?1:0);
  if (dir){ p.vx += dir*acc*dt; if (p.atk<=0) p.face = dir; }
  else p.vx *= Math.pow(0.0005, dt);
  p.vx = Math.max(-maxV, Math.min(maxV, p.vx));
  if (jumpPressed && p.onGround){ p.vy = -640; p.onGround = false; burst(p.x, GROUND, 6, ['#6b5a50','#3a302c'], 90); }
  p.vy += 1700*dt;
  p.x += p.vx*dt; p.y += p.vy*dt;
  if (p.y >= GROUND){ p.y = GROUND; p.vy = 0; p.onGround = true; }
  p.x = Math.max(40, Math.min(W-40, p.x));
  if (Math.abs(p.vx) > 20 && p.onGround) p.step += dt*Math.abs(p.vx)/30;

  // attack
  p.atkCD -= dt;
  if (attackPressed && p.atk <= 0 && p.atkCD <= 0){ p.atk = ATK_DUR; p.atkCD = ATK_DUR + 0.06; p.hitIds.clear(); sfx('swing'); }
  if (p.atk > 0){
    p.atk -= dt;
    const prog = 1 - p.atk/ATK_DUR;
    if (prog > 0.3 && prog < 0.85){
      const hx0 = p.face>0 ? p.x-10 : p.x-125, hx1 = hx0 + 135, hy0 = p.y-150, hy1 = p.y+5;
      for (const e of enemies){
        if (e.dead || p.hitIds.has(e.id)) continue;
        const ex0 = e.x - e.w/2, ex1 = e.x + e.w/2, ey0 = (e.type==='wisp'? e.y-e.h/2 : e.y-e.h), ey1 = (e.type==='wisp'? e.y+e.h/2 : e.y);
        if (ex1 > hx0 && ex0 < hx1 && ey1 > hy0 && ey0 < hy1){
          p.hitIds.add(e.id);
          e.hp--; e.flash = .12; e.kb = 420*p.face;
          sfx('hit'); hitStop = 0.05; shake = Math.max(shake, 6);
          burst(e.x, ey0 + (ey1-ey0)/2, 14, ['#ff7a1a','#ffb347','#ff3d00','#ffe08a']);
          if (e.hp <= 0){
            e.dead = true;
            combo++; comboT = 2.2;
            const pts = (e.type==='brute'?50:e.type==='wisp'?15:10) * Math.min(5, 1 + Math.floor(combo/3));
            score += pts;
            floats.push({x:e.x, y:ey0-10, txt:'+'+pts, t:1});
            burst(e.x, ey0 + (ey1-ey0)/2, 26, e.type==='wisp'?['#9ff','#5cf','#fff']:['#222','#111','#ff3d00','#ff7a1a'], 340);
          }
        }
      }
    }
  }
  attackPressed = false; jumpPressed = false; startPressed = false;

  if (comboT > 0){ comboT -= dt; if (comboT <= 0) combo = 0; }

  // spawn
  spawnT -= dt;
  if (spawnT <= 0){
    spawn();
    const diff = Math.min(1, elapsed/120);
    spawnT = (1.6 - diff*1.0) * (0.6 + Math.random()*0.8);
  }

  // enemies
  p.inv -= dt;
  for (const e of enemies){
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    e.x += e.kb*dt; e.kb *= Math.pow(0.002, dt);
    if (e.dead) continue;
    e.x -= e.speed*dt;
    if (e.type==='wisp'){
      e.ph += dt*3; e.y = e.baseY + Math.sin(e.ph)*35;
      // drift toward player height slightly
      e.baseY += Math.sign((p.y-70) - e.baseY) * 20 * dt;
    }
    // collision with player
    const ex0 = e.x - e.w/2 + 6, ex1 = e.x + e.w/2 - 6;
    const ey0 = e.type==='wisp'? e.y-e.h/2+6 : e.y-e.h+8, ey1 = e.type==='wisp'? e.y+e.h/2-6 : e.y;
    const px0 = p.x-22, px1 = p.x+22, py0 = p.y-125, py1 = p.y;
    if (p.inv <= 0 && ex1 > px0 && ex0 < px1 && ey1 > py0 && ey0 < py1){
      p.hp--; p.inv = 1.2; p.vx = (p.x < e.x ? -1 : 1) * 380; p.vy = -300; p.onGround=false;
      combo = 0; comboT = 0;
      shake = 14; sfx('hurt');
      burst(p.x, p.y-60, 20, ['#fff','#ccc','#c0392b']);
      if (p.hp <= 0){ state='over'; overT = 0; sfx('over'); if (score > best){ best = score; localStorage.setItem('saikoInuBest', best); } }
    }
  }
  enemies = enemies.filter(e => !(e.dead && Math.abs(e.kb) < 30 && e.flash <= 0) && e.x > -120);
  updateParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt*40);
}
function updateParticles(dt){
  for (const q of particles){ q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 500*dt; q.vx *= .98; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  for (const f of floats){ f.y -= 40*dt; f.t -= dt; }
  floats = floats.filter(f => f.t > 0);
}

// ---------- drawing: background ----------
const mountains = [];
for (let layer=0; layer<3; layer++){
  const pts=[]; let x=0;
  while(x<=W+80){ pts.push([x, 300 + layer*45 - Math.random()*(120-layer*30)]); x += 40+Math.random()*60; }
  mountains.push(pts);
}
function drawBG(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0709'); g.addColorStop(.55,'#2a0f0c'); g.addColorStop(.8,'#3d1610'); g.addColorStop(1,'#120a09');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // blood moon
  ctx.save();
  const mg = ctx.createRadialGradient(760,120,10,760,120,160);
  mg.addColorStop(0,'rgba(255,90,40,.35)'); mg.addColorStop(1,'rgba(255,60,20,0)');
  ctx.fillStyle = mg; ctx.fillRect(560,-60,400,360);
  ctx.fillStyle = '#c4452a'; ctx.beginPath(); ctx.arc(760,120,58,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(90,20,10,.35)'; for (const [cx,cy,cr] of [[742,108,14],[784,138,9],[772,94,6]]){ ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
  // mountains
  const cols = ['#1f0d0c','#170a0a','#100707'];
  mountains.forEach((pts,i) => {
    ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.moveTo(0,H);
    pts.forEach(([x,y]) => ctx.lineTo(x,y)); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  });
  // torii silhouette
  ctx.fillStyle = '#0a0505';
  const tx = 120, ty = GROUND;
  ctx.fillRect(tx-70, ty-190, 12, 190); ctx.fillRect(tx+58, ty-190, 12, 190);
  ctx.beginPath(); ctx.moveTo(tx-100,ty-200); ctx.quadraticCurveTo(tx,ty-188,tx+100,ty-200); ctx.lineTo(tx+96,ty-186); ctx.quadraticCurveTo(tx,ty-176,tx-96,ty-186); ctx.fill();
  ctx.fillRect(tx-80, ty-165, 160, 9);
  // lanterns glow
  for (const lx of [330, 620, 900]){
    const fl = .8 + Math.sin(t*6+lx)*.1 + Math.random()*.05;
    const lg = ctx.createRadialGradient(lx, GROUND-70, 2, lx, GROUND-70, 60);
    lg.addColorStop(0,`rgba(255,130,40,${.45*fl})`); lg.addColorStop(1,'rgba(255,80,20,0)');
    ctx.fillStyle = lg; ctx.fillRect(lx-60, GROUND-130, 120, 120);
    ctx.fillStyle = '#0a0505'; ctx.fillRect(lx-3, GROUND-50, 6, 50); ctx.fillRect(lx-12, GROUND-56, 24, 6);
    ctx.fillStyle = `rgba(255,150,60,${fl})`; ctx.fillRect(lx-9, GROUND-82, 18, 26);
    ctx.fillStyle = '#0a0505'; ctx.fillRect(lx-13, GROUND-88, 26, 6);
  }
  // ground
  const gg = ctx.createLinearGradient(0,GROUND,0,H);
  gg.addColorStop(0,'#2a1512'); gg.addColorStop(1,'#0c0707');
  ctx.fillStyle = gg; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle = 'rgba(255,90,30,.25)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,GROUND+1); ctx.lineTo(W,GROUND+1); ctx.stroke();
  // magma cracks in the ground
  ctx.strokeStyle = `rgba(255,${90+Math.sin(t*2)*30|0},20,.35)`; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const [a,b,c] of [[60,40,30],[260,30,50],[480,45,40],[700,35,60],[880,50,35]]){
    ctx.moveTo(a,GROUND+8); ctx.lineTo(a+b,GROUND+25); ctx.lineTo(a+b+20,GROUND+c+20); ctx.moveTo(a+b,GROUND+25); ctx.lineTo(a+b+40,GROUND+30);
  }
  ctx.stroke();
  // embers
  for (const m of embers){
    ctx.fillStyle = `rgba(255,${120+((m.ph*20)%80)|0},40,${m.a})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
  }
}

// ---------- drawing: Saiko Inu (wolf samurai) ----------
function drawAxe(glowT){
  // local coords: grip at (0,0), haft points up (-y), blade faces +x
  ctx.save();
  ctx.scale(0.82, 0.82);
  // haft
  ctx.fillStyle = '#5a1a14'; ctx.fillRect(-3.5,-92,7,122);
  ctx.strokeStyle = '#2a0b08'; ctx.lineWidth = 1.2;
  for (let y=-85; y<28; y+=7){ ctx.beginPath(); ctx.moveTo(-3.5,y); ctx.lineTo(3.5,y+4); ctx.stroke(); }
  // pommel spike
  ctx.fillStyle = '#2b2522'; ctx.beginPath(); ctx.moveTo(-5,30); ctx.lineTo(5,30); ctx.lineTo(0,42); ctx.fill();
  // top spike
  ctx.beginPath(); ctx.moveTo(-5,-92); ctx.lineTo(5,-92); ctx.lineTo(0,-112); ctx.fill();
  // blade (crescent), forward
  ctx.shadowColor = '#ff5a00'; ctx.shadowBlur = 18 + Math.sin(glowT*5)*6;
  ctx.fillStyle = '#1c1716';
  ctx.beginPath();
  ctx.moveTo(4,-92); ctx.lineTo(18,-96);
  ctx.quadraticCurveTo(52,-110,50,-122);
  ctx.quadraticCurveTo(70,-80,50,-38);
  ctx.quadraticCurveTo(52,-50,18,-56);
  ctx.lineTo(4,-60); ctx.closePath(); ctx.fill();
  // back small blade
  ctx.beginPath(); ctx.moveTo(-4,-88); ctx.quadraticCurveTo(-22,-84,-24,-94); ctx.quadraticCurveTo(-30,-76,-24,-58); ctx.quadraticCurveTo(-22,-66,-4,-64); ctx.fill();
  ctx.shadowBlur = 0;
  // edge
  ctx.strokeStyle = '#4a4040'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(50,-122); ctx.quadraticCurveTo(70,-80,50,-38); ctx.stroke();
  // magma cracks
  const hot = 180 + Math.sin(glowT*6)*60 | 0;
  ctx.strokeStyle = `rgb(255,${hot},40)`; ctx.lineWidth = 1.6;
  ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(14,-76); ctx.lineTo(26,-82); ctx.lineTo(34,-98); ctx.lineTo(44,-108);
  ctx.moveTo(26,-82); ctx.lineTo(40,-78); ctx.lineTo(54,-84);
  ctx.moveTo(18,-70); ctx.lineTo(32,-62); ctx.lineTo(46,-52);
  ctx.moveTo(32,-62); ctx.lineTo(50,-68);
  ctx.moveTo(-8,-76); ctx.lineTo(-18,-82); ctx.moveTo(-10,-72); ctx.lineTo(-20,-66);
  ctx.stroke();
  // core orb
  const og = ctx.createRadialGradient(0,-76,1,0,-76,14);
  og.addColorStop(0,'#fff3c0'); og.addColorStop(.35,'#ffa020'); og.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(0,-76,14,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#2b2522'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0,-76,7.5,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawPlayer(p, t){
  if (p.inv > 0 && Math.floor(p.inv*14)%2===0 && state==='play') return;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.face, 1);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(0, 2, 30, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.scale(1.25, 1.25); // facing right in local coords
  const walk = p.onGround ? Math.sin(p.step) : 0.6;
  const bob = p.onGround ? Math.abs(Math.sin(p.step))*2 : 0;
  ctx.translate(0, -bob);

  // tail (behind)
  ctx.save(); ctx.translate(-14,-48); ctx.rotate(-0.5 + Math.sin(t*4)*0.15);
  ctx.fillStyle = '#141114'; ctx.beginPath(); ctx.ellipse(-14,8,10,22,-0.9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ece8e4'; ctx.beginPath(); ctx.ellipse(-26,22,6,10,-0.9,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // legs (hakama + shin guards + white paws)
  for (const side of [-1, 1]){
    const sw = walk * 0.45 * side;
    ctx.save(); ctx.translate(side*7, -40); ctx.rotate(sw);
    ctx.fillStyle = '#1a1416'; // hakama
    ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(10,0); ctx.lineTo(12,22); ctx.lineTo(-12,22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5a1a14'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(0,22); ctx.stroke();
    ctx.fillStyle = '#0f0c0d'; ctx.fillRect(-7,20,14,16); // suneate
    ctx.strokeStyle = '#a3261c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-7,24); ctx.lineTo(7,28); ctx.moveTo(7,24); ctx.lineTo(-7,28); ctx.moveTo(-7,30); ctx.lineTo(7,34); ctx.moveTo(7,30); ctx.lineTo(-7,34); ctx.stroke();
    ctx.fillStyle = '#ece8e4'; ctx.beginPath(); ctx.ellipse(3,39,9,4.5,0,0,Math.PI*2); ctx.fill(); // paw
    ctx.fillStyle = '#7a5a3a'; ctx.fillRect(-6,40,18,2); // waraji
    ctx.restore();
  }

  // torso armor
  ctx.fillStyle = '#16121a';
  ctx.beginPath(); ctx.moveTo(-18,-88); ctx.lineTo(18,-88); ctx.lineTo(16,-42); ctx.lineTo(-16,-42); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7a1e16'; ctx.lineWidth = 1.2;
  for (let y=-82; y<-50; y+=7){ ctx.beginPath(); ctx.moveTo(-17,y); ctx.lineTo(17,y); ctx.stroke(); }
  // crest
  ctx.fillStyle = '#8a6a3a'; ctx.beginPath(); ctx.arc(4,-74,4.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#16121a'; ctx.beginPath(); ctx.arc(4,-74,2,0,Math.PI*2); ctx.fill();
  // kusazuri (skirt plates)
  ctx.fillStyle = '#121014';
  ctx.fillRect(-19,-44,12,14); ctx.fillRect(-6,-44,12,15); ctx.fillRect(7,-44,12,14);
  ctx.strokeStyle = '#7a1e16'; ctx.beginPath(); ctx.moveTo(-19,-37); ctx.lineTo(19,-37); ctx.stroke();
  // red obi
  ctx.fillStyle = '#a3261c'; ctx.fillRect(-18,-50,36,8);
  ctx.fillStyle = '#8a1d15';
  ctx.beginPath(); ctx.moveTo(6,-46); ctx.lineTo(0,-54); ctx.lineTo(0,-38); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6,-46); ctx.lineTo(14,-54); ctx.lineTo(14,-38); ctx.closePath(); ctx.fill();
  ctx.fillRect(4,-44,4,14); ctx.fillRect(9,-44,3,11);

  // back shoulder plate
  ctx.fillStyle = '#100d10'; ctx.fillRect(-26,-90,14,20);
  ctx.strokeStyle = '#7a1e16'; ctx.beginPath(); ctx.moveTo(-26,-83); ctx.lineTo(-12,-83); ctx.moveTo(-26,-76); ctx.lineTo(-12,-76); ctx.stroke();

  // head
  ctx.save(); ctx.translate(4,-100);
  // ears
  ctx.fillStyle = '#141114';
  ctx.beginPath(); ctx.moveTo(-12,-8); ctx.lineTo(-10,-28); ctx.lineTo(-1,-12); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2,-12); ctx.lineTo(9,-30); ctx.lineTo(14,-8); ctx.fill();
  ctx.fillStyle = '#ece8e4';
  ctx.beginPath(); ctx.moveTo(-9,-11); ctx.lineTo(-9,-22); ctx.lineTo(-4,-13); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5,-12); ctx.lineTo(9,-24); ctx.lineTo(11,-11); ctx.fill();
  // skull (black)
  ctx.fillStyle = '#141114'; ctx.beginPath(); ctx.ellipse(0,-2,16,15,0,0,Math.PI*2); ctx.fill();
  // white face mask
  ctx.fillStyle = '#ece8e4';
  ctx.beginPath(); ctx.moveTo(-10,2); ctx.quadraticCurveTo(0,-8,6,-4); ctx.lineTo(26,2); ctx.quadraticCurveTo(28,8,22,11); ctx.lineTo(-4,14); ctx.quadraticCurveTo(-12,10,-10,2); ctx.fill();
  // cheek fluff
  ctx.beginPath(); ctx.moveTo(-14,4); ctx.lineTo(-20,14); ctx.lineTo(-10,12); ctx.lineTo(-12,18); ctx.lineTo(0,14); ctx.fill();
  // black brow stripe between eyes
  ctx.fillStyle = '#141114'; ctx.beginPath(); ctx.moveTo(2,-8); ctx.lineTo(14,-2); ctx.lineTo(4,-1); ctx.fill();
  // nose
  ctx.fillStyle = '#0a0809'; ctx.beginPath(); ctx.ellipse(25,3,3.5,3,0,0,Math.PI*2); ctx.fill();
  // mouth / fangs (snarl)
  ctx.strokeStyle = '#3a0a08'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(23,8); ctx.lineTo(10,10); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(18,8.5); ctx.lineTo(19.5,12.5); ctx.lineTo(21,8.2); ctx.fill();
  // glowing red eye
  ctx.shadowColor = '#ff2a10'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#ff2a10'; ctx.beginPath(); ctx.moveTo(6,-3); ctx.lineTo(14,-3); ctx.lineTo(12,0); ctx.lineTo(7,0); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // arms + axe  (phi = axe angle: 0 = haft straight up, + = tilted forward; theta = arm angle)
  let phi, theta;
  if (p.atk > 0){
    const prog = 1 - p.atk/ATK_DUR;
    if (prog < 0.25) phi = 0.55 - (prog/0.25)*1.85;                          // raise & wind back
    else phi = -1.3 + Math.min(1, (prog-0.25)/0.45) * 3.5;                  // overhead chop forward/down
    theta = phi + Math.PI;
  } else { phi = 0.55 + Math.sin(t*2)*0.04; theta = -0.5; }
  ctx.save(); ctx.translate(6,-76);
  ctx.rotate(theta);
  ctx.fillStyle = '#100d10'; ctx.fillRect(-5,0,11,24);
  ctx.strokeStyle = '#a3261c'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-5,8); ctx.lineTo(6,12); ctx.moveTo(6,8); ctx.lineTo(-5,12); ctx.stroke();
  ctx.translate(0,27);
  ctx.rotate(phi - theta);
  drawAxe(t);
  ctx.fillStyle = '#ece8e4'; ctx.beginPath(); ctx.arc(0,0,5.5,0,Math.PI*2); ctx.fill(); // white paw gripping haft
  ctx.restore();
  const ang = theta;
  // front shoulder plate (over arm)
  ctx.fillStyle = '#1b161c'; ctx.save(); ctx.translate(6,-84); ctx.rotate(p.atk>0 ? 0.25 : 0);
  ctx.fillRect(-4,-6,18,20);
  ctx.strokeStyle = '#7a1e16'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-4,1); ctx.lineTo(14,1); ctx.moveTo(-4,8); ctx.lineTo(14,8); ctx.stroke();
  ctx.restore();

  // swing trail
  if (p.atk > 0){
    const prog = 1 - p.atk/ATK_DUR;
    if (prog > 0.25 && prog < 0.9){
      const a1 = -Math.PI/2 - 1.3, a2 = -Math.PI/2 + (-1.3 + Math.min(1,(prog-0.25)/0.45)*3.5);
      ctx.save(); ctx.translate(6,-76);
      ctx.globalAlpha = 1 - Math.max(0,(prog-0.7)/0.2);
      ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 20;
      const lg = ctx.createRadialGradient(0,0,60,0,0,140);
      lg.addColorStop(0,'rgba(255,90,0,0)'); lg.addColorStop(.6,'rgba(255,140,30,.55)'); lg.addColorStop(1,'rgba(255,220,120,.9)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(0,0,120,a1, a2); ctx.arc(0,0,70,a2,a1,true); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

// ---------- drawing: enemies ----------
function drawEnemy(e, t){
  ctx.save();
  ctx.translate(e.x, e.y);
  const fl = e.flash > 0;
  if (e.dead) ctx.globalAlpha = Math.max(0, e.flash*8);
  if (e.type === 'wisp'){
    const g = ctx.createRadialGradient(0,0,2,0,0,30);
    g.addColorStop(0, fl?'#fff':'#e0ffff'); g.addColorStop(.4,'rgba(80,200,255,.8)'); g.addColorStop(1,'rgba(40,120,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(120,220,255,.5)';
    ctx.beginPath(); ctx.moveTo(-6,-10); ctx.quadraticCurveTo(26+Math.sin(t*12)*6,-4,34,0); ctx.quadraticCurveTo(26,6,-6,10); ctx.fill();
    ctx.fillStyle = '#05202a'; ctx.beginPath(); ctx.arc(-6,-3,2.5,0,7); ctx.arc(3,-3,2.5,0,7); ctx.fill();
  } else {
    const big = e.type === 'brute';
    const s = big ? 1.25 : 1;
    ctx.scale(-s, s); // faces left
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(0,2,24,5,0,0,7); ctx.fill();
    const step = Math.sin(e.t*10);
    const body = fl ? '#fff' : (big ? '#2a1418' : '#1a1a22');
    // legs
    ctx.fillStyle = fl ? '#fff' : '#0e0e12';
    ctx.save(); ctx.translate(-6,-34); ctx.rotate(step*.4); ctx.fillRect(-4,0,8,34); ctx.restore();
    ctx.save(); ctx.translate(6,-34); ctx.rotate(-step*.4); ctx.fillRect(-4,0,8,34); ctx.restore();
    // body / robe
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(-16,-74); ctx.lineTo(16,-74); ctx.lineTo(20,-30); ctx.lineTo(-20,-30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = fl ? '#fff' : (big ? '#4a2a10' : '#3a3a48'); ctx.fillRect(-18,-46,36,5);
    // head
    if (big){
      // oni: horns + mask
      ctx.fillStyle = fl ? '#fff' : '#7a1610'; ctx.beginPath(); ctx.arc(0,-86,15,0,7); ctx.fill();
      ctx.fillStyle = fl ? '#fff' : '#d8c8a8';
      ctx.beginPath(); ctx.moveTo(-10,-96); ctx.lineTo(-16,-114); ctx.lineTo(-4,-99); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10,-96); ctx.lineTo(16,-114); ctx.lineTo(4,-99); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(4,-78); ctx.lineTo(7,-72); ctx.lineTo(10,-78); ctx.fill();
      // club
      ctx.save(); ctx.translate(14,-60); ctx.rotate(-0.6 + Math.sin(e.t*4)*.2);
      ctx.fillStyle = fl ? '#fff' : '#3a2a20'; ctx.fillRect(-3,-46,7,50);
      ctx.fillStyle = fl ? '#fff' : '#2a1d16'; ctx.fillRect(-7,-50,15,24);
      ctx.restore();
    } else {
      // shadow ronin w/ straw hat + katana
      ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0,-84,11,0,7); ctx.fill();
      ctx.fillStyle = fl ? '#fff' : '#3a2e1c';
      ctx.beginPath(); ctx.moveTo(-24,-88); ctx.lineTo(0,-104); ctx.lineTo(24,-88); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.translate(12,-56); ctx.rotate(-0.9);
      ctx.fillStyle = '#cfd6dc'; ctx.fillRect(-1.5,-50,3,46);
      ctx.fillStyle = '#222'; ctx.fillRect(-2,-4,4,12);
      ctx.restore();
    }
    // glowing eyes
    if (!fl){
      ctx.shadowColor = '#ff2010'; ctx.shadowBlur = 8; ctx.fillStyle = '#ff3a20';
      ctx.fillRect(2, big?-90:-86, 4, 2.5); ctx.fillRect(8, big?-90:-86, 4, 2.5);
      ctx.shadowBlur = 0;
    }
    if (big && !e.dead){ // hp pips
      ctx.scale(-1,1);
      for (let i=0;i<e.hp;i++){ ctx.fillStyle='#ff6a20'; ctx.fillRect(-12+i*9,-128,7,3); }
    }
  }
  ctx.restore();
}

// ---------- HUD ----------
function drawHeart(x,y,full){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = full ? '#d8321e' : '#3a1a16';
  if (full){ ctx.shadowColor='#ff3a10'; ctx.shadowBlur=8; }
  ctx.beginPath(); ctx.moveTo(0,6); ctx.bezierCurveTo(-14,-4,-8,-14,0,-6); ctx.bezierCurveTo(8,-14,14,-4,0,6); ctx.fill();
  ctx.restore();
}
function text(s,x,y,size,color='#e8dcd0',align='center',glow){
  ctx.font = `${size}px Georgia, "Times New Roman", serif`; ctx.textAlign = align; ctx.textBaseline='middle';
  if (glow){ ctx.shadowColor = glow; ctx.shadowBlur = 14; }
  ctx.fillStyle = color; ctx.fillText(s,x,y); ctx.shadowBlur = 0;
}
function drawHUD(){
  ctx.fillStyle = 'rgba(10,6,6,.6)'; ctx.fillRect(0,0,W,44);
  ctx.strokeStyle = '#5a1a14'; ctx.beginPath(); ctx.moveTo(0,44); ctx.lineTo(W,44); ctx.stroke();
  text('SAIKO INU', 20, 22, 20, '#e8dcd0', 'left');
  for (let i=0;i<3;i++) drawHeart(170+i*28, 23, i < player.hp);
  text('SCORE ' + score, W/2, 22, 22, '#ffb070', 'center', '#ff5a00');
  text('BEST ' + best, W-20, 22, 18, '#a89888', 'right');
  if (combo >= 2) text(combo + 'x COMBO', W/2, 66, 20, '#ffd27a', 'center', '#ff6a00');
}

function letterSpaced(s, x, y, size, spacing, color, glow){
  ctx.font = `${size}px Georgia, "Times New Roman", serif`; ctx.textBaseline='middle'; ctx.textAlign='left';
  const widths = [...s].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a,b)=>a+b,0) + spacing*(s.length-1);
  let cx = x - total/2;
  if (glow){ ctx.shadowColor = glow; ctx.shadowBlur = 20; }
  ctx.fillStyle = color;
  [...s].forEach((ch,i) => { ctx.fillText(ch, cx, y); cx += widths[i] + spacing; });
  ctx.shadowBlur = 0;
}

// ---------- main loop ----------
let last = performance.now(), T = 0;
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now; T += dt;
  update(dt);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  drawBG(T);
  for (const e of enemies) drawEnemy(e, T);
  drawPlayer(player, T);
  for (const q of particles){
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life*2));
    ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of floats){ ctx.globalAlpha = Math.min(1,f.t*2); text(f.txt, f.x, f.y, 20, '#ffd27a', 'center', '#ff6a00'); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // vignette
  const v = ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);

  if (state === 'play'){
    drawHUD();
    if (paused){ ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,H); text('PAUSED', W/2, H/2, 48, '#ffb070', 'center', '#ff5a00'); }
  } else if (state === 'title'){
    ctx.fillStyle = 'rgba(8,4,4,.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(20,10,10,.8)'; ctx.fillRect(W/2-300, 70, 600, 90);
    ctx.strokeStyle = '#7a1e16'; ctx.lineWidth = 2; ctx.strokeRect(W/2-296, 74, 592, 82);
    letterSpaced('SAIKO INU', W/2, 116, 62, 14, '#efe4d8', '#ff4a10');
    text('The Magma Axe', W/2, 190, 24, '#ffb070', 'center', '#ff5a00');
    text('Move: \u2190 \u2192 / A D     Jump: \u2191 / W     Swing axe: SPACE / click', W/2, 380, 18, '#d8c8b8');
    text('Cut down the shadow ronin, spirit wisps and oni. Don\u2019t get hit \u2014 3 HP.', W/2, 410, 16, '#a89888');
    if (Math.floor(T*2)%2===0) text('Press SPACE / tap to begin', W/2, 470, 24, '#ffd27a', 'center', '#ff6a00');
    if (best) text('Best: ' + best, W/2, 505, 16, '#a89888');
  } else if (state === 'over'){
    ctx.fillStyle = 'rgba(8,0,0,.6)'; ctx.fillRect(0,0,W,H);
    letterSpaced('DEFEATED', W/2, 170, 64, 10, '#e04a2a', '#ff2a00');
    text('SAIKO INU falls... for now.', W/2, 235, 22, '#d8c8b8');
    text('Score: ' + score, W/2, 290, 32, '#ffb070', 'center', '#ff5a00');
    text((score >= best && score > 0 ? 'NEW BEST! ' : 'Best: ') + best, W/2, 330, 20, '#ffd27a');
    if (overT > 0.8 && Math.floor(T*2)%2===0) text('Press SPACE / tap to restart', W/2, 410, 24, '#ffd27a', 'center', '#ff6a00');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
